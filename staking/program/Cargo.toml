[package]
name = "port-finance-staking"
version = "0.1.0"
edition = "2021"

[features]
no-entrypoint = []
test-bpf = []

[dependencies]
arrayref = "0.3.7"
do-notation = "0.1"
bytemuck = { version = "1.14", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
solana-program = "1.18.26"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
thiserror = "1.0"
uint = "0.9"

[dev-dependencies]
assert_matches = "1.5.0"
base64 = "0.22"
log = "0.4"
proptest = "1.4"
solana-program-test = "1.18.26"
solana-sdk = "1.18.26"
serde = "1.0"
serde_yaml = "0.9"

[lib]
crate-type = ["cdylib", "lib"]
